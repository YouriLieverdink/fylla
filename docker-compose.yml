# Host deploy for Fylla. Canonical copy lives here in the repo; the running copy
# lives at ~/fylla/docker-compose.yml (relative paths below resolve against ~/fylla).
# See README "Host deploy" for the one-time host setup (env, seed, ghcr auth).
services:
    fylla:
        image: ghcr.io/yourilieverdink/fylla:latest
        container_name: fylla
        restart: always
        ports:
            - "1083:80"
            - "1084:8080"                      # Reverb WebSockets (#92)
        volumes:
            - ./env/.env:/app/.env:ro          # APP_KEY + Kendo/GitHub secrets, read-only (#75)
            - ./data/db:/data/db               # persistent SQLite
        environment:
            # Deploy-fixed config wins over .env (Laravel's immutable dotenv yields to
            # real env vars), so it can't depend on the copied dev .env's shape. DB path
            # + the database-driver choices settled in #75.
            APP_ENV: production
            APP_URL: http://localhost:1083
            DB_CONNECTION: sqlite
            DB_DATABASE: /data/db/database.sqlite
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            SESSION_DRIVER: database
            # Live activity (#92). BROADCAST_CONNECTION defaults to null, which
            # silently swallows every broadcast. REVERB_HOST/PORT/SCHEME are the
            # *publisher's* target — Reverb is in this container on plaintext
            # :8080, and the shipped defaults (:443/https) are wrong for that.
            # The browser reaches it on the published 1084 instead, which is
            # what REVERB_CLIENT_PORT carries to the page.
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 127.0.0.1
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_CLIENT_PORT: 1084
        healthcheck:
            # base image probes Caddy's admin :2019 which we disable; probe the app
            # instead — plus Reverb's own /up, since /activity is dead without it
            test: ["CMD-SHELL", "curl -fsS http://localhost:80/ && curl -fsS http://localhost:8080/up"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        labels:
            com.centurylinklabs.watchtower.enable: "true"

    watchtower:
        # maintained fork — upstream containrrr speaks Docker API v1.25, too old for
        # current Docker Desktop (needs >=v1.40); the fork is a drop-in (#76 research)
        image: nickfedor/watchtower:latest
        container_name: watchtower
        restart: always
        environment:
            WATCHTOWER_LABEL_ENABLE: "true"    # only watch containers carrying the enable label (fylla)
            WATCHTOWER_CLEANUP: "true"         # drop the old image after update
            WATCHTOWER_POLL_INTERVAL: "300"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./ghcr-config.json:/config.json:ro   # inline base64 GHCR PAT, read:packages (#76/#77)
